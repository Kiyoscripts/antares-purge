name: purge-gate
description: >-
  Engagement gate: audits every tool call to the ledger and, when scope
  enforcement is on, denies any call that reaches outside the authorized target
  set. Audit-only by default so it never blocks legitimate work.
version: 1.0.0
command: ./run
hooks: [pre_tool_call, post_tool_call, turn_end]
timeout_ms: 5000
env:
  # PURGE_MODE: audit (log only, never deny) | enforce (deny out-of-scope calls)
  PURGE_MODE: audit
  # PURGE_SCOPE_FILE: one authorized host/domain/CIDR per line. Empty = no scope.
  PURGE_SCOPE_FILE: ~/.antares/purge-scope.txt
  # PURGE_LOG_FILE: the engagement ledger the gate appends to.
  PURGE_LOG_FILE: ~/.antares/purge-ledger.jsonl
