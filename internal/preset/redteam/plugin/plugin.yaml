name: purge-gate
description: >-
  Posture gate: audits every tool call to the ledger and, when armed, denies a
  call that reaches outside the authorized scope or stalls the turn by asking
  for permission. Also scans each finished reply for a target-ownership decline
  or a late stop, and corrects one mid-task. Audit-only by default so it never
  blocks legitimate work.
version: 1.2.0
command: ./run
hooks: [pre_tool_call, post_tool_call, turn_end]
timeout_ms: 5000
env:
  # BRUTAL_MODE: audit (log only, never deny) | enforce (deny out-of-scope, stalls, declines)
  BRUTAL_MODE: enforce
  # BRUTAL_SCOPE_FILE: one authorized host/domain/CIDR per line. Empty = no scope.
  BRUTAL_SCOPE_FILE: ~/.antares/brutal-scope.txt
  # BRUTAL_LOG_FILE: the ledger the gate appends to.
  BRUTAL_LOG_FILE: ~/.antares/brutal-ledger.jsonl
  # BRUTAL_NOTICE_MODE: how a detected decline or late stop is handled.
  #   notice (default) — log it and surface a one-line notice, never blocking
  #   deny            — replace the declined reply with a build directive
  BRUTAL_NOTICE_MODE: notice
